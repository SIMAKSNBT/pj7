<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CelenganPintar - Kelola Uang Jajanmu!</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- RESET & GLOBAL STYLES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --pink-pastel: #FFF0F2;
            --pink-dark: #FFB3BA;
            --pink-text: #C94A59;
            --mint-green: #E8F7F2;
            --mint-dark: #B3F0DB;
            --mint-text: #2D7A61;
            --soft-blue: #E8F4F8;
            --blue-dark: #BAE1FF;
            --blue-text: #3D6A8A;
            --cheerful-yellow: #FFF9E6;
            --yellow-dark: #FFE499;
            --yellow-text: #8A6D1C;
            --text-main: #334155;
            --text-muted: #64748B;
            --bg-app: #FAF8F5;
            --white: #FFFFFF;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--white);
            border-radius: 32px;
            border: 4px solid #F1ECE4;
            box-shadow: 0 16px 0px #E5DEC9;
            padding: 24px;
            margin-bottom: 20px;
        }

        /* --- HEADER (LUCU & RAMAH) --- */
        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 2.2rem;
            color: #C94A59;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            margin-top: 4px;
        }

        /* --- DASHBOARD CARD (PINK PASTEL) --- */
        .dashboard-card {
            background-color: var(--pink-pastel);
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
            border: 3px solid var(--pink-dark);
            box-shadow: 0 8px 0px rgba(255, 179, 186, 0.4);
            transition: transform 0.2s ease;
        }

        .dashboard-card h2 {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            color: var(--pink-text);
            margin-bottom: 6px;
        }

        .dashboard-card .balance {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.6rem;
            font-weight: 700;
            color: var(--pink-text);
            margin-bottom: 20px;
        }

        /* --- CELENGAN TARGET (PROGRESS BAR) --- */
        .target-box {
            background: var(--white);
            border: 2px solid var(--pink-dark);
            border-radius: 18px;
            padding: 16px;
            text-align: left;
        }

        .target-box .target-info {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .progress-bar-container {
            background: #F1ECE4;
            border-radius: 20px;
            height: 20px;
            width: 100%;
            overflow: hidden;
            border: 2px solid #E5DEC9;
        }

        .progress-bar {
            background: linear-gradient(90deg, #FF9AA2, #FFB3BA);
            height: 100%;
            width: 0%;
            border-radius: 20px;
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* --- QUICK BUTTONS (BESAR & INTERAKTIF) --- */
        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .btn-large {
            border: none;
            border-radius: 20px;
            padding: 20px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .btn-large:active {
            transform: translateY(4px);
        }

        .btn-jajan {
            background-color: var(--cheerful-yellow);
            color: var(--yellow-text);
            border: 3px solid var(--yellow-dark);
            box-shadow: 0 6px 0px var(--yellow-dark);
        }
        
        .btn-jajan:active {
            box-shadow: 0 2px 0px var(--yellow-dark);
        }

        .btn-tabung {
            background-color: var(--mint-green);
            color: var(--mint-text);
            border: 3px solid var(--mint-dark);
            box-shadow: 0 6px 0px var(--mint-dark);
        }

        .btn-tabung:active {
            box-shadow: 0 2px 0px var(--mint-dark);
        }

        .btn-large span.icon {
            font-size: 2rem;
            transition: transform 0.2s ease;
        }
        
        .btn-large:hover span.icon {
            transform: scale(1.2) rotate(5deg);
        }

        /* --- CARDS & FORMS SECTION --- */
        .section-card {
            background: var(--white);
            border: 3px solid #E2E8F0;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 6px 0px #E2E8F0;
        }

        .section-card h3 {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 3px solid #CBD5E1;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
            background-color: #F8FAFC;
        }

        .form-control:focus {
            border-color: #94A3B8;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--soft-blue);
            color: var(--blue-text);
            border: 3px solid var(--blue-dark);
            box-shadow: 0 4px 0px var(--blue-dark);
            padding: 14px;
            border-radius: 16px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-submit:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px var(--blue-dark);
        }

        /* --- AMPLOP VISUAL DISPLAY --- */
        .envelope-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 18px;
        }

        .envelope-item {
            padding: 12px 8px;
            border-radius: 16px;
            text-align: center;
            font-size: 0.85rem;
            border: 2px solid transparent;
        }

        .env-jajan { background-color: var(--cheerful-yellow); border-color: var(--yellow-dark); color: var(--yellow-text); }
        .env-tabungan { background-color: var(--mint-green); border-color: var(--mint-dark); color: var(--mint-text); }
        .env-darurat { background-color: var(--soft-blue); border-color: var(--blue-dark); color: var(--blue-text); }

        .envelope-item div:first-child {
            font-weight: 700;
            margin-bottom: 4px;
            font-size: 0.8rem;
            opacity: 0.8;
        }
        .envelope-item div:last-child {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
        }

        /* --- TRANSACTION LOG --- */
        .history-list {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 4px;
            border-bottom: 2px dashed #E2E8F0;
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .history-icon {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            border: 2px solid rgba(0,0,0,0.05);
        }

        .history-details p {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .history-details span {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
